<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | l'albero di ciliegio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container pagina">
    <section class="auth">
      <div class="lado"><p>A harmonia silenciosa entre a cerâmica viva e o espírito contemplativo.</p></div>
      <form onsubmit="entrar(event)">
        <h1>Bem-vindo de volta</h1>
        <p class="aviso-form">Acesse sua conta para acompanhar seus pedidos e peças favoritas.</p>
        <label>E-mail<input name="email" type="email" placeholder="nome@dominio.com.br" required></label>
        <label>Senha<input name="senha" type="password" placeholder="Sua senha" required></label>
        <p id="erro"></p>
        <button class="btn btn-primario" type="submit">Entrar na minha conta</button>
        <p class="aviso-form">Novo por aqui? <a href="cadastro.html"><strong>Cadastre-se</strong></a></p>
        <p class="aviso-form">Simulação escolar: não use senhas reais.</p>
      </form>
    </section>
  </main>
  <script src="produtos.js"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
