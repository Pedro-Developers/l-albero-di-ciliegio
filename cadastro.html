<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | l'albero di ciliegio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container pagina">
    <section class="auth">
      <div class="lado"><p>Junte-se à nossa comunidade de colecionadores e amantes da botânica.</p></div>
      <form onsubmit="cadastrar(event)">
        <h1>Crie sua conta</h1>
        <p class="aviso-form">Ganhe 10% OFF no primeiro pedido com o cupom BEMVINDO10.</p>
        <label>Nome completo<input name="nome" placeholder="Ex.: Giulia Rossi" required></label>
        <label>E-mail<input name="email" type="email" placeholder="giulia@email.com" required></label>
        <label>Senha<input name="senha" type="password" placeholder="Mínimo 6 caracteres" required></label>
        <label>Confirmar senha<input name="confirmar" type="password" placeholder="Repita a senha" required></label>
        <p id="erro"></p>
        <button class="btn btn-primario" type="submit">Criar conta</button>
        <p class="aviso-form">Já tem conta? <a href="login.html"><strong>Entrar</strong></a></p>
      </form>
    </section>
  </main>
  <script src="js/produtos.js"></script>
  <script src="js/script.js"></script>
  <script src="js/acesso.js"></script>
</body>
</html>
